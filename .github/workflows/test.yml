name: Run Tests

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install pnpm
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run eslint
        run: pnpm lint

      - name: Run prettier:check
        run: pnpm format:check

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit dependencies (OSV-Scanner)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

      # osv-scanner.toml ignores apply to the full lockfile above. Re-scan the
      # production dependency tree with no ignores, so an ignored advisory
      # fails CI if it ever reaches a production dependency.
      - name: Install production dependencies only
        run: pnpm install --frozen-lockfile --prod --ignore-scripts

      - name: Audit production dependencies (OSV-Scanner, no ignores)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --config=/dev/null
            --lockfile=pnpm-lock.yaml:node_modules/.pnpm/lock.yaml
