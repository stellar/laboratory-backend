name: Build

# On every push to main: run the test suite, then build the image and push it
# to Docker Hub as stellar/laboratory-backend:<sha>. The dev environments in
# stellar/kube pick that tag up automatically (ArgoCD Image Updater).
#
# Production is gated: the `promote-to-prd` job runs under the protected
# `production` GitHub Environment, so it pauses until a required reviewer
# approves it in the Actions run. On approval it re-tags the same image as
# stellar/laboratory-backend:prd-<sha>, which is the tag pattern the prd
# ImageUpdaters in stellar/kube watch. The pause only exists while "Required
# reviewers" is configured on the `production` environment in the repository
# settings; without it the job runs straight through.
#
# `workflow_dispatch` (main only) re-runs just the promotion for the <sha>
# image that already exists for HEAD; it never rebuilds or overwrites it.

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

# Nothing here needs the GITHUB_TOKEN beyond checkout; Docker Hub uses its own
# secrets. The reusable test workflow inherits this.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-push-sha-tagged-image:
    name: Build and push a sha tagged container image
    needs: test
    runs-on: ubuntu-24.04
    # Push only: a manual dispatch never rebuilds, so an already published
    # <sha> tag (the image dev received) is never overwritten.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: make docker-build
      - name: Push image to DockerHub
        run: make docker-push

  promote-to-prd:
    name: Promote the sha tagged image to prd
    needs: [test, build-and-push-sha-tagged-image]
    runs-on: ubuntu-24.04
    # Runs after a push to main has built the <sha> image, or on a manual
    # dispatch of `main` only (the build job is skipped then and the <sha>
    # image that already exists for HEAD is promoted as is). Other branches
    # can never reach prd.
    if: >-
      ${{ !cancelled() && needs.test.result == 'success' &&
      ((github.event_name == 'push' && needs.build-and-push-sha-tagged-image.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    # Protected environment: "Required reviewers" on `production` makes this
    # job wait for a manual approval before anything reaches prd. Without that
    # rule configured in the repository settings the job runs straight through.
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Determine image label
        id: vars
        run: echo "label=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push the prd image
        env:
          LABEL: ${{ steps.vars.outputs.label }}
        run: |
          set -eu
          TAG="stellar/laboratory-backend:${LABEL}"
          TAG_PRD="stellar/laboratory-backend:prd-${LABEL}"
          docker pull "${TAG}"
          docker tag "${TAG}" "${TAG_PRD}"
          docker push "${TAG_PRD}"

  build-and-push-release-image:
    name: Build and push a release tagged container image
    needs: test
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        env:
          TAG: stellar/laboratory-backend:${{ github.event.release.tag_name }}
        run: make docker-build
      - name: Tag image as latest
        run: docker tag "stellar/laboratory-backend:${{ github.event.release.tag_name }}" "stellar/laboratory-backend:latest"
      - name: Push image to DockerHub
        env:
          TAG: stellar/laboratory-backend:${{ github.event.release.tag_name }}
        run: make docker-push
      - name: Push latest image to DockerHub
        env:
          TAG: stellar/laboratory-backend:latest
        run: make docker-push
